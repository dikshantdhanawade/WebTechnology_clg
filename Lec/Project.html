<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart </title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container{
            width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .products{
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .product{
            border: 1px solid #ddd;
            padding: 10px;
            width: 150px;
            border-radius: 5px;
        }

        button{
            padding: 6px 10px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            margin-top: 5px;
        }

        button:hover{
            background: #0056b3;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 8px;
        }

        .remove-btn{
            background: red;
        }

        .total{
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Shopping Cart </h2>

    <div class="products">
        <div class="product">
            <h4>BOOK 1</h4>
            <p>₹500</p>
            <button class="addBtn" data-name="Product 1" data-price="500">Add</button>
        </div>

        <div class="product">
            <h4>BOOK 2</h4>
            <p>₹800</p>
            <button class="addBtn" data-name="Product 2" data-price="800">Add</button>
        </div>

        <div class="product">
            <h4>BOOK 3</h4>
            <p>₹1200</p>
            <button class="addBtn" data-name="Product 3" data-price="1200">Add</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cartBody"></tbody>
    </table>

    <div class="total">
        Grand Total: ₹<span id="grandTotal">0</span>
    </div>
</div>

<script>
    const addButtons = document.querySelectorAll(".addBtn");
    const cartBody = document.getElementById("cartBody");
    const grandTotalElement = document.getElementById("grandTotal");

    let cart = [];

    // Add Button Event
    addButtons.forEach(button => {
        button.addEventListener("click", function(){
            const name = this.dataset.name;
            const price = Number(this.dataset.price);

            let existing = cart.find(item => item.name === name);

            if(existing){
                existing.qty++;
            } else {
                cart.push({name: name, price: price, qty: 1});
            }

            updateCart();
        });
    });

    function updateCart(){
        cartBody.innerHTML = "";
        let grandTotal = 0;

        cart.forEach(item => {
            const total = item.price * item.qty;
            grandTotal += total;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.name}</td>
                <td>₹${item.price}</td>
                <td>${item.qty}</td>
                <td>₹${total}</td>
                <td><button class="remove-btn">Remove</button></td>
            `;

            // Remove Event
            row.querySelector(".remove-btn").addEventListener("click", function(){
                cart = cart.filter(p => p.name !== item.name);
                updateCart();
            });

            cartBody.appendChild(row);
        });

        grandTotalElement.textContent = grandTotal;
    }

</script>

</body>
</html>
