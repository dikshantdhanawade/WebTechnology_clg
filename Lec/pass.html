<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            text-align:center;
        }

        h1{
            margin-top:20px;
        }

        form{
            background:white;
            padding:20px;
            width:350px;
            margin:20px auto;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        input{
            width:90%;
            padding:8px;
            margin:8px 0;
            border-radius:5px;
            border:1px solid #ccc;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        table{
            margin:20px auto;
            border-collapse: collapse;
            width:80%;
            background:white;
        }

        th, td{
            padding:10px;
            border:1px solid #ccc;
        }

        th{
            background:#007bff;
            color:white;
        }

        .pass{
            color:green;
            font-weight:bold;
        }

        .fail{
            color:red;
            font-weight:bold;
        }
    </style>
</head>
<body>

<h1>Student Result Management System</h1>

<form id="resultForm">
    <input type="text" id="name" placeholder="Enter Student Name" required><br>
    <input type="number" id="sub1" placeholder="Subject 1 Marks" required><br>
    <input type="number" id="sub2" placeholder="Subject 2 Marks" required><br>
    <input type="number" id="sub3" placeholder="Subject 3 Marks" required><br>
    <p><b>Total:</b> <span id="total">0</span></p>
    <p><b>Percentage:</b> <span id="percentage">0%</span></p>
    <button type="submit">Generate Result</button>
</form>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Grade</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="resultTable">
    </tbody>
</table>

<script>

let sub1 = document.getElementById("sub1");
let sub2 = document.getElementById("sub2");
let sub3 = document.getElementById("sub3");

function calculate() {

    let m1 = Number(sub1.value) || 0;
    let m2 = Number(sub2.value) || 0;
    let m3 = Number(sub3.value) || 0;

    let total = m1 + m2 + m3;
    let percentage = (total / 300) * 100;

    document.getElementById("total").textContent = total;
    document.getElementById("percentage").textContent = percentage.toFixed(2) + "%";
}

sub1.addEventListener("input", calculate);
sub2.addEventListener("input", calculate);
sub3.addEventListener("input", calculate);

document.getElementById("resultForm").addEventListener("submit", function(e){

    e.preventDefault();

    let name = document.getElementById("name").value;
    let total = Number(document.getElementById("total").textContent);
    let percentage = parseFloat(document.getElementById("percentage").textContent);

    let grade = "";
    let status = "";

    if(percentage >= 80){
        grade = "A";
    } else if(percentage >= 60){
        grade = "B";
    } else if(percentage >= 40){
        grade = "C";
    } else {
        grade = "F";
    }

    status = (percentage >= 40) ? "Pass" : "Fail";

    let table = document.getElementById("resultTable");

    let row = document.createElement("tr");

    row.innerHTML = `
        <td>${name}</td>
        <td>${total}</td>
        <td>${percentage.toFixed(2)}%</td>
        <td>${grade}</td>
        <td class="${status === 'Pass' ? 'pass' : 'fail'}">${status}</td>
    `;

    table.appendChild(row);

    document.getElementById("resultForm").reset();
    document.getElementById("total").textContent = "0";
    document.getElementById("percentage").textContent = "0%";
});

</script>

</body>
</html>
