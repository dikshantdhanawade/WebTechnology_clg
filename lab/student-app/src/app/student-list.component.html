<div class="student-container">
  <div class="form-section">
    <h2>Add New Student</h2>
    <form (ngSubmit)="addStudent($event)">
      <div class="form-row">
        <label for="name">Name</label>
        <input
          id="name"
          [(ngModel)]="newStudent.name"
          name="name"
          type="text"
          placeholder="Enter student name"
        />
      </div>
      <div class="form-row">
        <label for="age">Age</label>
        <input
          id="age"
          [(ngModel)]="newStudent.age"
          name="age"
          type="number"
          min="1"
          placeholder="Age"
        />
      </div>
      <div class="form-row">
        <label for="course">Course</label>
        <input
          id="course"
          [(ngModel)]="newStudent.course"
          name="course"
          type="text"
          placeholder="Course name"
        />
      </div>
      <div class="form-row">
        <label for="grade">Grade</label>
        <select
          id="grade"
          [(ngModel)]="newStudent.grade"
          name="grade"
        >
          <option value="A+">A+</option>
          <option value="A">A</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B">B</option>
          <option value="B-">B-</option>
          <option value="C+">C+</option>
          <option value="C">C</option>
        </select>
      </div>
      <div class="form-row">
        <label for="attendance">Attendance</label>
        <input
          id="attendance"
          [(ngModel)]="newStudent.attendance"
          name="attendance"
          type="number"
          min="0"
          max="100"
          placeholder="Attendance %"
        />
      </div>
      <button type="submit" class="btn-add">Add Student</button>
    </form>
  </div>

  <div class="table-section">
    <h2>Student List</h2>
    <table *ngIf="students.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
          <th>Grade</th>
          <th>Attendance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students">
          <td>{{ student.id }}</td>
          <td>{{ student.name }}</td>
          <td>{{ student.age }}</td>
          <td>{{ student.course }}</td>
          <td>{{ student.grade }}</td>
          <td>{{ student.attendance }}%</td>
          <td>
            <button
              class="btn-remove"
              (click)="removeStudent(student.id)"
            >
              Remove
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="students.length === 0" class="empty-state">No students added yet.</p>
  </div>
</div>
