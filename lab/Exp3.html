<!DOCTYPE html>
<html>
<head>
    <title>Form Validation Experiment</title>

    <!-- Internal CSS -->
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        label{
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .error{
            color: red;
            font-size: 13px;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Registration Form</h2>

        <label>Name:</label>
        <input type="text" id="name">
        <span id="nameError" class="error"></span>

        <label>Email:</label>
        <input type="text" id="email">
        <span id="emailError" class="error"></span>

        <label>Password:</label>
        <input type="password" id="password">
        <span id="passwordError" class="error"></span>

        <button onclick="SubmitButtonClick()">Submit</button>
    </div>

<script>
function SubmitButtonClick(){

    let name = document.getElementById('name').value.trim();
    let email = document.getElementById('email').value.trim();
    let password = document.getElementById('password').value.trim();

    document.getElementById('nameError').innerHTML="";
    document.getElementById('emailError').innerHTML="";
    document.getElementById('passwordError').innerHTML="";

    let isvalid = true;

    if (name === ""){
        document.getElementById("nameError").innerHTML="Name field is required";
        isvalid = false;
    }

    if (!email.includes("@")){
        document.getElementById("emailError").innerHTML="Valid email is required";
        isvalid = false;
    }

    if (password.length < 6){
        document.getElementById("passwordError").innerHTML="Password must be at least 6 characters";
        isvalid = false;
    }

    if(isvalid){
        alert("Form Submitted Successfully!");
    }
}
</script>

</body>
</html>
